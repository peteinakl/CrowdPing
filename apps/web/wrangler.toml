name = "crowdping-web"
compatibility_date = "2026-01-01"
main = "worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Local dev only. Production values are set in the Cloudflare dashboard's project settings
# (see docs/DEPLOYMENT.md) — never commit real upstream URLs or origins here beyond
# the local defaults.
[vars]
SUPABASE_FUNCTIONS_BASE_URL = "http://127.0.0.1:54321/functions/v1"
ALLOWED_APP_ORIGINS = "http://127.0.0.1:8788"
APP_BASE_URL = "http://127.0.0.1:8788"
